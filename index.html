<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thanksgiving 2026 — Teen Choice & Family Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 22, 36, 0.88);
      --accent-pink: #ff2a70;
      --accent-purple: #8b5cf6;
      --accent-cyan: #00f2fe;
      --accent-gold: #ffb800;
      --accent-green: #10b981;
      --text: #ffffff;
      --text-sub: #94a3b8;
      --card-radius: 22px;
      --font-display: 'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030407;
      color: var(--text);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
    }

    /* Mobile Container Frame */
    .story-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 440px;
      max-height: 920px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
    }

    @media (min-width: 450px) and (min-height: 680px) {
      .story-container {
        border-radius: 40px;
        height: 92vh;
        border: 2px solid rgba(255, 255, 255, 0.15);
      }
    }

    /* Story Top Progress Bars */
    .story-progress-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 3.5px;
      z-index: 100;
    }

    .story-seg {
      flex: 1;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      overflow: hidden;
    }

    .story-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 2px;
      transition: width 0.15s linear;
    }

    .story-seg.active .story-fill,
    .story-seg.completed .story-fill {
      width: 100%;
    }

    /* Top Floating Story Header */
    .story-header {
      position: absolute;
      top: 24px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 90;
    }

    .story-author {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .author-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 10px rgba(255, 42, 112, 0.5);
    }

    .author-text strong {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      display: block;
      line-height: 1.1;
    }

    .author-text span {
      font-size: 10px;
      color: var(--text-sub);
    }

    .btn-quick-vote {
      background: linear-gradient(135deg, #ff2a70, #8b5cf6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 42, 112, 0.4);
      z-index: 95;
    }

    /* Slides Viewport */
    .slides-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide {
      min-width: 100%;
      height: 100%;
      padding: 68px 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background-size: cover;
      background-position: center;
      overflow-y: auto;
    }

    .slide-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    /* Badges & Titles */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .badge-rank1 { background: linear-gradient(135deg, #ff2a70, #ff6b4a); border: none; }
    .badge-rank2 { background: linear-gradient(135deg, #0d9488, #00f2fe); border: none; }
    .badge-rank3 { background: linear-gradient(135deg, #10b981, #059669); border: none; }
    .badge-rank4 { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; }
    .badge-rank5 { background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; }

    .title-large {
      font-family: var(--font-display);
      font-size: 2.1rem;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.5px;
      margin-top: 8px;
      background: linear-gradient(135deg, #ffffff 40%, #ffd1e0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-resort {
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1.15;
      margin-top: 6px;
      color: #fff;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.35;
      margin-top: 4px;
    }

    /* Main Visual Card */
    .story-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--card-radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    .resort-img-preview {
      width: 100%;
      height: 170px;
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .img-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 12px;
    }

    /* Buttons Row: Video + Direct Vote */
    .action-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .story-video-btn {
      flex: 1;
      padding: 13px 14px;
      background: linear-gradient(135deg, #ff2a70, #8b5cf6);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 18px;
      color: white;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(255, 42, 112, 0.45);
      transition: transform 0.15s ease;
      z-index: 30;
    }

    .story-video-btn:active {
      transform: scale(0.97);
    }

    .pulse-play {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: white;
      color: #ff2a70;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      box-shadow: 0 0 10px white;
      animation: pulseAnim 2s infinite ease-in-out;
    }

    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .story-instant-vote-btn {
      background: rgba(16, 185, 129, 0.25);
      border: 1.5px solid #10b981;
      color: #34d399;
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      z-index: 30;
    }

    .story-instant-vote-btn:active {
      transform: scale(0.96);
      background: #10b981;
      color: white;
    }

    /* Price & Delta Row */
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 14px;
      padding: 10px 14px;
    }

    .price-num {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 900;
      color: #fff;
    }

    .savings-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .save-green { background: rgba(16, 185, 129, 0.25); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .save-neutral { background: rgba(255, 255, 255, 0.15); color: #cbd5e1; }

    /* Perks / Bullet Points */
    .perks-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .perk-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: #f8fafc;
    }

    .perk-ico {
      font-size: 20px;
      flex-shrink: 0;
    }

    /* Summary Matrix Slide */
    .scorecard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0;
      max-height: 460px;
      overflow-y: auto;
    }

    .scorecard-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 10px 12px;
      gap: 8px;
    }

    .scorecard-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .score-rank-badge {
      font-size: 13px;
      font-weight: 900;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .scorecard-info strong {
      display: block;
      font-size: 13px;
    }

    .scorecard-info span {
      font-size: 11px;
      color: var(--text-sub);
    }

    .scorecard-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-video-icon {
      background: linear-gradient(135deg, #ff2a70, #ff5e3a);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 42, 112, 0.6);
      z-index: 30;
    }

    /* =========================================================================
       SUPER SIMPLE & BULLETPROOF VOTING PAGE (Slide 15)
       ========================================================================= */
    .voting-slide-box {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      z-index: 50;
    }

    .voter-selector-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 8px 0 12px;
    }

    .voter-selector-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-sub);
    }

    .voter-tabs-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .voter-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 8px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .voter-pill.active {
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.2);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
    }

    .voter-pill.voted {
      border-color: #10b981;
    }

    .voter-pill .v-ico { font-size: 20px; }
    .voter-pill .v-name { font-size: 11px; font-weight: 800; color: #fff; }
    .voter-pill .v-check { font-size: 9px; color: #10b981; font-weight: 800; }

    /* Simple Yes/No Ballot Grid */
    .simple-ballot-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 270px;
      overflow-y: auto;
      margin-bottom: 12px;
      padding-right: 4px;
    }

    .ballot-item-row {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .ballot-item-row.is-picked {
      border-color: #10b981;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(0, 242, 254, 0.2));
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
    }

    .ballot-title strong {
      display: block;
      font-size: 13px;
      color: #fff;
    }

    .ballot-title span {
      font-size: 11px;
      color: var(--text-sub);
    }

    .btn-vote-yes {
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: white;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .ballot-item-row.is-picked .btn-vote-yes {
      background: #10b981;
      border-color: #10b981;
      color: white;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    /* Live Tally Scoreboard */
    .live-tally-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px;
    }

    .tally-winner-banner {
      background: linear-gradient(135deg, rgba(255, 184, 0, 0.25), rgba(255, 42, 112, 0.25));
      border: 1px solid rgba(255, 184, 0, 0.5);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      color: #ffd700;
    }

    .tally-member-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .v-chip {
      background: rgba(255, 255, 255, 0.12);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 8px;
      color: #e2e8f0;
    }

    /* Transparent Tap Navigation Zones (only on slides 0 to 13) */
    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30%;
      z-index: 20;
    }
    .tap-zone.left { left: 0; }
    .tap-zone.right { right: 0; width: 70%; }
    .tap-zone.disabled { display: none !important; }

    /* Footer */
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-sub);
      z-index: 10;
      margin-top: 8px;
    }

    /* Video Modal */
    .video-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .video-modal-backdrop.open {
      display: flex;
    }

    .video-modal-card {
      width: 100%;
      max-width: 440px;
      background: #0f1322;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
    }

    .video-modal-head {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-modal-head h3 {
      font-size: 14px;
      font-weight: 800;
    }

    .btn-close-vmodal {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 800;
    }

    .video-player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
    }

    .video-modal-foot {
      padding: 12px 18px;
      display: flex;
      justify-content: flex-end;
      background: rgba(0, 0, 0, 0.3);
    }

    .btn-direct-yt {
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="story-container">
    <!-- Top Story Progress Bar -->
    <div class="story-progress-bar" id="storyProgressBar"></div>

    <!-- Top Floating Header -->
    <div class="story-header">
      <div class="story-author">
        <div class="author-avatar">🌴</div>
        <div class="author-text">

      </div>
      <button class="btn-quick-vote" onclick="jumpToVote()">🗳️ Vote Now</button>

    <!-- Tap Zones for Story Navigation -->
    <div class="tap-zone left" id="tapLeft" onclick="prevSlide()"></div>
    <div class="tap-zone right" id="tapRight" onclick="nextSlide()"></div>

    <!-- Slides Viewport -->
    <div class="slides-wrapper" id="slidesWrapper"></div>

  <!-- Video Modal -->

        <a id="videoDirectLink" href="#" target="_blank" class="btn-direct-yt">↗ Open on YouTube</a>
      </div>
    </div>
  </div>

      {

      },
      {
        id: "ziva",
        name: "Hyatt Ziva Puerto Vallarta",
        rank: 6,
        badge: "Baseline Control (#6)",
        score: "77",
        price: "$9,275.00",
        savings: "Baseline ($0)",
        location: "Puerto Vallarta, Mexico",
        heroImg: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
        pitch: "Repeat the 2025 trip: zero uncertainty and strong parent confidence, but zero novelty.",
        perks: [
          { icon: "🏖️", text: "Private secluded cove beach & calm Pacific waters" },
          { icon: "🌮", text: "Known food carts, taco shacks & dessert stations" },
          { icon: "✨", text: "Zero learning curve & reliable 5-star service" },
          { icon: "⚠️", text: "Zero novelty: repeating a trip already taken" }
        ],
        videoTitle: "Hyatt Ziva Puerto Vallarta Resort Walkthrough",
        youtubeId: "WjK7eS5hJ-Y",
        videoUrl: "https://www.youtube.com/results?search_query=Hyatt+Ziva+Puerto+Vallarta+tour"
      }
    ];

    const FAMILY_MEMBERS = [
      { id: "todd", name: "Todd", role: "Dad", avatar: "👨‍💼" },
      { id: "meiling", name: "Mei-Ling", role: "Mom", avatar: "👩‍💼" },
      { id: "sofia", name: "Sofia", role: "Teen", avatar: "👧" },
      { id: "cora", name: "Cora", role: "Teen", avatar: "👧" },
      { id: "violet", name: "Violet", role: "Teen", avatar: "👧" }
    ];

    // State
    let currentSlide = 0;
    let totalSlides = 0;
    let activeVoter = "sofia";
    let votingVotes = JSON.parse(localStorage.getItem('teen_story_votes') || '{}');

    // Build Story App
    function init() {
      const wrapper = document.getElementById('slidesWrapper');
      let slidesHTML = '';

      // 1. SPLASH STORY INTRO
      slidesHTML += `
        <div class="slide" style="background: radial-gradient(circle at top right, rgba(255,42,112,0.4), transparent 65%), radial-gradient(circle at bottom left, rgba(139,92,246,0.45), transparent 70%);">
          <div class="slide-content">
            <div>
              <span class="badge" style="background: linear-gradient(135deg, #ff2a70, #8b5cf6);">✈️ Thanksgiving 2026</span>
              <h1 class="title-large">Where Are We<br>Going Next?! 🌴</h1>
              <p class="subtitle">5 Travelers · Nov 20–24.<br>Swipe or tap right to see the 5 challengers + repeat, watch walkthrough videos, and vote!</p>
            </div>

            <div class="story-card" style="text-align: center; padding: 24px 16px;">
              <div style="font-size: 4.5rem; margin: 4px 0;">🏖️✨🎉</div>
              <div style="background: rgba(255,255,255,0.1); padding: 14px; border-radius: 16px; font-weight: 800; font-size: 15px; color: #fff;">
                Tap right to start resort tour →
              </div>
            </div>

            <div class="slide-footer">
              <span>Family Board Edition</span>
              <span>Tap right to start →</span>
            </div>
          </div>
        </div>
      `;

      // 2. RESORT SLIDES (2 slides per resort = 12 slides)
      RESORTS.forEach((r, idx) => {
        // Page 1 of Option: Vibe & Video
        slidesHTML += `
          <div class="slide" style="background: radial-gradient(circle at top right, rgba(0,242,254,0.22), transparent 60%), radial-gradient(circle at bottom left, rgba(255,42,112,0.28), transparent 60%);">
            <div class="slide-content">
              <div>
                <span class="badge badge-rank${r.rank}">${r.badge}</span>
                <h2 class="title-resort">${r.name}</h2>
                <p class="subtitle">📍 ${r.location}</p>
              </div>

              <div class="story-card">
                <div class="resort-img-preview" style="background-image: url('${r.heroImg}');">
                  <span class="img-badge">${r.location}</span>
                </div>
                <div class="price-row">
                  <div>
                    <span style="font-size: 10.5px; color: var(--text-sub); display: block;">Package Total</span>
                    <span class="price-num">${r.price}</span>
                  </div>
                  <span class="savings-badge ${r.savings.includes('-') ? 'save-green' : 'save-neutral'}">${r.savings}</span>
                </div>
                <p style="font-size: 13px; color: #f1f5f9; line-height: 1.35;">${r.pitch}</p>
              </div>

              <div class="action-btn-row">
                <button class="story-video-btn" onclick="openVideoModal('${r.id}')">
                  <span style="display: flex; align-items: center; gap: 8px;">
                    <span class="pulse-play">▶</span>
                    <span>Watch Video Tour 🎬</span>
                  </span>
                  <span style="font-size: 11px; opacity: 0.85;">Play →</span>
                </button>
                <button class="story-instant-vote-btn" onclick="quickVoteForResort('${r.id}')">
                  👍 Vote YES
                </button>
              </div>

              <div class="slide-footer">
                <span>Score: <strong>${r.score}/100</strong></span>
                <span>Tap for highlights →</span>
              </div>
            </div>
          </div>
        `;

        // Page 2 of Option: Highlights & Perks
        const perksHTML = r.perks.map(p => `
          <li class="perk-item">
            <span class="perk-ico">${p.icon}</span>
            <span>${p.text}</span>
          </li>
        `).join('');

        slidesHTML += `
          <div class="slide" style="background: radial-gradient(circle at top right, rgba(139,92,246,0.35), transparent 60%), radial-gradient(circle at bottom left, rgba(16,185,129,0.22), transparent 60%);">
            <div class="slide-content">
              <div>
                <span class="badge badge-rank${r.rank}">Option ${idx + 1} of 6 • Highlights</span>
                <h2 class="title-resort">Why It's Epic 🔥</h2>
              </div>

              <div class="story-card" style="padding: 16px 14px;">
                <ul class="perks-list">
                  ${perksHTML}
                </ul>
              </div>

              <div class="action-btn-row">
                <button class="story-video-btn" onclick="openVideoModal('${r.id}')">
                  <span style="display: flex; align-items: center; gap: 8px;">
                    <span class="pulse-play">▶</span>
                    <span>Watch Full Walkthrough 🎬</span>
                  </span>
                  <span style="font-size: 11px; opacity: 0.85;">Tour →</span>
                </button>
                <button class="story-instant-vote-btn" onclick="quickVoteForResort('${r.id}')">
                  👍 Vote YES
                </button>
              </div>

              <div class="slide-footer">
                <span>${r.name}</span>
                <span>Next option next →</span>
              </div>
            </div>
          </div>
        `;
      });

      // 3. SCORECARD & VIDEO SUMMARY SLIDE
      const scorecardHTML = RESORTS.map((r, i) => `
        <div class="scorecard-card">
          <div class="scorecard-left">
            <span class="score-rank-badge">#${i + 1}</span>
            <div class="scorecard-info">
              <strong>${r.name}</strong>
              <span>${r.price} · ${r.savings}</span>
            </div>
          </div>
          <div class="scorecard-right">
            <button class="btn-video-icon" onclick="openVideoModal('${r.id}')" title="Watch ${r.name} Video">
              ▶
            </button>
          </div>
        </div>
      `).join('');

      slidesHTML += `
        <div class="slide" style="background: radial-gradient(circle at top right, rgba(0,242,254,0.3), transparent 60%), radial-gradient(circle at bottom left, rgba(255,42,112,0.35), transparent 60%);">
          <div class="slide-content">
            <div>
              <span class="badge">📊 All Contenders</span>
              <h2 class="title-resort">The Scorecard</h2>
              <p class="subtitle">Rankings based on pools, food & fun. Tap ▶ to watch any video tour!</p>
            </div>

            <div class="scorecard-list">
              ${scorecardHTML}
            </div>

            <div class="slide-footer">
              <span>All 6 Options</span>
              <span>Tap to vote now →</span>
            </div>
          </div>
        </div>
      `;

      // 4. VOTING SLIDE (Slide 15)
      slidesHTML += `
        <div class="slide" id="votingSlide" style="background: radial-gradient(circle at top right, rgba(255,42,112,0.4), transparent 60%), radial-gradient(circle at bottom left, rgba(139,92,246,0.45), transparent 60%);">
          <div class="slide-content voting-slide-box">
            <div>
              <span class="badge" style="background: linear-gradient(135deg, #ff2a70, #ffb800); color: white;">🗳️ Board Decision</span>
              <h2 class="title-resort">Vote For Your Pick! 🎉</h2>
              <p class="subtitle">Tap your name, then tap <strong>Vote YES</strong> for your resort!</p>
            </div>

            <!-- Voter Selector Bar -->
            <div class="voter-selector-bar">
              <span class="voter-selector-label">1. Select Who Is Voting:</span>
              <div class="voter-tabs-row" id="voterTabsRow"></div>
            </div>

            <!-- Simple Vote List -->
            <div class="simple-ballot-list" id="simpleBallotList"></div>

            <!-- Live Scoreboard -->
            <div class="live-tally-card" id="liveTallyCard"></div>

            <div class="slide-footer">
              <span>Family Board Voting</span>
              <span>1 Vote Each</span>
            </div>
          </div>
        </div>
      `;

      wrapper.innerHTML = slidesHTML;
      totalSlides = document.querySelectorAll('.slide').length;

      // Progress bars
      const progressContainer = document.getElementById('storyProgressBar');
      let progressHTML = '';
      for (let i = 0; i < totalSlides; i++) {
        progressHTML += `
          <div class="story-seg" id="seg-${i}">
            <div class="story-fill"></div>
          </div>
        `;
      }
      progressContainer.innerHTML = progressHTML;

      renderVoterPills();
      renderBallotList();
      renderTally();
      updateSlide();
    }

    // =========================================================================
    // VOTING LOGIC
    // =========================================================================
    function renderVoterPills() {
      const row = document.getElementById('voterTabsRow');
      if (!row) return;

      row.innerHTML = FAMILY_MEMBERS.map(m => {
        const isActive = activeVoter === m.id;
        const hasVoted = !!votingVotes[m.id];
        return `
          <div class="voter-pill ${isActive ? 'active' : ''} ${hasVoted ? 'voted' : ''}" 
               onclick="selectVoter('${m.id}')">
            <span class="v-ico">${m.avatar}</span>
            <span class="v-name">${m.name}</span>
            <span class="v-check">${hasVoted ? '✓ Voted' : 'Pick'}</span>
          </div>
        `;
      }).join('');
    }

    function selectVoter(voterId) {
      activeVoter = voterId;
      renderVoterPills();
      renderBallotList();
    }

    function renderBallotList() {
      const container = document.getElementById('simpleBallotList');
      if (!container) return;

      const currentVote = votingVotes[activeVoter];

      container.innerHTML = RESORTS.map(r => {
        const isPicked = currentVote === r.id;
        return `
          <div class="ballot-item-row ${isPicked ? 'is-picked' : ''}" onclick="toggleVote('${r.id}')">
            <div class="ballot-title">
              <strong>${r.name}</strong>
              <span>${r.price} · ${r.savings}</span>
            </div>
            <button class="btn-vote-yes">
              ${isPicked ? '✓ VOTED YES' : '👍 Vote YES'}
            </button>
          </div>
        `;
      }).join('');
    }

    function toggleVote(resortId) {
      if (votingVotes[activeVoter] === resortId) {
        // Unvote if tapped again
        delete votingVotes[activeVoter];
      } else {
        // Vote YES for this resort
        votingVotes[activeVoter] = resortId;
      }
      localStorage.setItem('teen_story_votes', JSON.stringify(votingVotes));
      renderVoterPills();
      renderBallotList();
      renderTally();
    }

    function quickVoteForResort(resortId) {
      votingVotes[activeVoter] = resortId;
      localStorage.setItem('teen_story_votes', JSON.stringify(votingVotes));
      const member = FAMILY_MEMBERS.find(m => m.id === activeVoter);
      const chosenResort = RESORTS.find(r => r.id === resortId);
      alert(`🎉 ${member.name} voted for ${chosenResort.name}!\nTaking you to the live board tally...`);
      jumpToVote();
    }

    function renderTally() {
      const container = document.getElementById('liveTallyCard');
      if (!container) return;

      const tally = {};
      RESORTS.forEach(r => {
        tally[r.id] = { resort: r, votes: 0, voters: [] };
      });

      let totalVoted = 0;
      FAMILY_MEMBERS.forEach(m => {
        const pick = votingVotes[m.id];
        if (pick && tally[pick]) {
          tally[pick].votes++;
          tally[pick].voters.push(m);
          totalVoted++;
        }
      });

      const sorted = Object.values(tally).sort((a, b) => b.votes - a.votes);
      const leader = sorted[0]?.votes > 0 ? sorted[0] : null;

      let bannerHTML = '';
      if (leader) {
        bannerHTML = `
          <div class="tally-winner-banner">
            <span>🏆 Current Leader:</span>
            <strong>${leader.resort.name} (${leader.votes} vote${leader.votes > 1 ? 's' : ''})</strong>
          </div>
        `;
      }

      let breakdownHTML = sorted.map(item => {
        const pct = totalVoted > 0 ? Math.round((item.votes / 5) * 100) : 0;
        return `
          <div style="margin-top: 4px;">
            <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 2px;">
              <strong style="color: #fff;">${item.resort.name}</strong>
              <span style="color: #38bdf8; font-weight: 800;">${item.votes} vote${item.votes === 1 ? '' : 's'}</span>
            </div>
            <div style="height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden;">
              <div style="width: ${pct}%; height: 100%; background: linear-gradient(90deg, #ff2a70, #8b5cf6); border-radius: 3px;"></div>
            </div>
            ${item.voters.length > 0 ? `
              <div class="tally-member-chips">
                ${item.voters.map(v => `<span class="v-chip">${v.avatar} ${v.name}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      container.innerHTML = `
        ${bannerHTML}
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 6px;">
          <span>Turnout: <strong>${totalVoted} of 5 Voted</strong></span>
          <span style="color: #ff2a70; font-weight: 700; cursor: pointer;" onclick="resetStoryVotes()">Reset All</span>
        </div>
        ${breakdownHTML}
      `;
    }

    function resetStoryVotes() {
      if (confirm("Reset all 5 board votes?")) {
        votingVotes = {};
        localStorage.removeItem('teen_story_votes');
        renderVoterPills();
        renderBallotList();
        renderTally();
      }
    }

    // =========================================================================
    // NAVIGATION & TOUCH CONTROLS
    // =========================================================================
    function updateSlide() {
      const wrapper = document.getElementById('slidesWrapper');
      wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;

      const counter = document.getElementById('storySlideCounter');
      if (counter) counter.innerText = `${currentSlide + 1} of ${totalSlides}`;

      // Disable tap zones on the voting slide so clicks go straight to buttons!
      const tapLeft = document.getElementById('tapLeft');
      const tapRight = document.getElementById('tapRight');
      const isVotingSlide = (currentSlide === totalSlides - 1);

      if (tapLeft && tapRight) {
        if (isVotingSlide) {
          tapLeft.classList.add('disabled');
          tapRight.classList.add('disabled');
        } else {
          tapLeft.classList.remove('disabled');
          tapRight.classList.remove('disabled');
        }
      }

      for (let i = 0; i < totalSlides; i++) {
        const seg = document.getElementById(`seg-${i}`);
        if (!seg) continue;
        if (i < currentSlide) {
          seg.className = 'story-seg completed';
        } else if (i === currentSlide) {
          seg.className = 'story-seg active';
        } else {
          seg.className = 'story-seg';
        }
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function jumpToVote() {
      currentSlide = totalSlides - 1;
      updateSlide();
    }

    // =========================================================================
    // VIDEO MODAL
    // =========================================================================
    function openVideoModal(resortId) {
      const resort = RESORTS.find(r => r.id === resortId);
      if (!resort) return;

      const modal = document.getElementById('videoModal');
      const title = document.getElementById('videoModalTitle');
      const sub = document.getElementById('videoModalSub');
      const box = document.getElementById('videoIframeBox');
      const direct = document.getElementById('videoDirectLink');

      title.innerText = resort.videoTitle;
      sub.innerText = `${resort.name} · Walkthrough Tour`;
      direct.href = resort.videoUrl;

      box.innerHTML = `
        <iframe width="100%" height="100%" 
                src="https://www.youtube-nocookie.com/embed/${resort.youtubeId}?autoplay=1&rel=0" 
                title="${resort.videoTitle}" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
      `;

      modal.classList.add('open');
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const box = document.getElementById('videoIframeBox');
      box.innerHTML = '';
      modal.classList.remove('open');
    }

    // Touch Swipe Support (only active on non-voting slides)
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      // Do not swipe-skip on voting slide so scrolling through resorts is smooth!
      if (currentSlide !== totalSlides - 1) {
        if (touchEndX < touchStartX - 50) nextSlide();
        if (touchEndX > touchStartX + 50) prevSlide();
      }
    }, { passive: true });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    init();
  </script>
</body>
