<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thanksgiving 2026 — Teen Choice Story & Board Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(22, 26, 43, 0.75);
      --accent-magenta: #ff2a70;
      --accent-purple: #8b5cf6;
      --accent-cyan: #00f2fe;
      --accent-amber: #ffb800;
      --accent-green: #10b981;
      --text: #ffffff;
      --text-sub: #94a3b8;
      --card-radius: 22px;
      --font-display: 'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030407;
      color: var(--text);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
    }

    /* App / Phone Viewport */
    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 440px;
      max-height: 920px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    @media (min-width: 450px) and (min-height: 700px) {
      .app-container {
        border-radius: 38px;
        height: 92vh;
        border: 2px solid #232942;
      }
    }

    /* Top Instagram / TikTok Story Progress Bars */
    .story-progress-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 4px;
      z-index: 100;
    }

    .story-progress-segment {
      flex: 1;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      overflow: hidden;
    }

    .story-progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 2px;
      transition: width 0.15s linear;
    }

    .story-progress-segment.active .story-progress-fill {
      width: 100%;
    }

    .story-progress-segment.completed .story-progress-fill {
      width: 100%;
    }

    /* Top Story Meta Header */
    .story-top-header {
      position: absolute;
      top: 26px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 90;
    }

    .story-channel {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .channel-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-magenta), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 8px rgba(255, 42, 112, 0.5);
    }

    .channel-info strong {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: block;
      line-height: 1.1;
    }

    .channel-info span {
      font-size: 10px;
      color: var(--text-sub);
    }

    .story-quick-controls {
      display: flex;
      gap: 6px;
    }

    .btn-icon-sm {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 700;
    }

    /* Slides Viewport & Animation */
    .slides-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide {
      min-width: 100%;
      height: 100%;
      padding: 70px 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background-size: cover;
      background-position: center;
      overflow-y: auto;
    }

    .slide-gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(7,9,14,0.7) 0%, rgba(7,9,14,0.4) 40%, rgba(7,9,14,0.92) 100%);
      z-index: 1;
    }

    .slide-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    /* Badges & Titles */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      width: fit-content;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .badge-rank1 { background: linear-gradient(135deg, #ff2a70, #ff6b4a); color: white; border: none; }
    .badge-rank2 { background: linear-gradient(135deg, #0d9488, #00f2fe); color: white; border: none; }
    .badge-rank3 { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; }
    .badge-rank4 { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; }
    .badge-rank5 { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; }
    .badge-baseline { background: rgba(255, 255, 255, 0.2); color: #cbd5e1; }

    .title-large {
      font-family: var(--font-display);
      font-size: 2.1rem;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.5px;
      margin-top: 10px;
      background: linear-gradient(135deg, #ffffff 40%, #ffd1e0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-option {
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1.15;
      margin-top: 8px;
      color: #fff;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.4;
      margin-top: 6px;
    }

    /* Visual Media & Hero Card */
    .story-hero-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--card-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 12px 0;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .resort-img-box {
      width: 100%;
      height: 180px;
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .img-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 12px;
    }

    /* TikTok / Story Video Action Banner */
    .story-video-btn {
      width: 100%;
      padding: 12px 14px;
      background: linear-gradient(135deg, rgba(255, 42, 112, 0.85), rgba(139, 92, 246, 0.85));
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      color: white;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 42, 112, 0.35);
      transition: transform 0.15s ease;
      z-index: 60;
    }

    .story-video-btn:active {
      transform: scale(0.97);
    }

    .video-pulse-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: white;
      color: #ff2a70;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 0 10px white;
      animation: pulsePlay 1.8s infinite ease-in-out;
    }

    @keyframes pulsePlay {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* Highlight Feature Pills & Points */
    .story-points-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0;
    }

    .story-point-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .point-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    /* Price & Score Banner */
    .price-score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 14px;
      padding: 10px 14px;
    }

    .price-val {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 900;
      color: #fff;
    }

    .savings-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .save-green { background: rgba(16, 185, 129, 0.25); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .save-neutral { background: rgba(255, 255, 255, 0.15); color: #cbd5e1; }

    /* Summary Matrix & Scorecard Slide */
    .scorecard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0;
      max-height: 480px;
      overflow-y: auto;
    }

    .scorecard-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 12px;
      gap: 8px;
    }

    .scorecard-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scorecard-rank {
      font-size: 14px;
      font-weight: 900;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scorecard-title strong {
      display: block;
      font-size: 13px;
    }

    .scorecard-title span {
      font-size: 11px;
      color: var(--text-sub);
    }

    .scorecard-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scorecard-points {
      font-size: 13px;
      font-weight: 800;
      color: #38bdf8;
    }

    .btn-table-video {
      background: #ff2a70;
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 42, 112, 0.5);
      z-index: 60;
    }

    /* Voting Page (Slide 15) */
    .voter-selector-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .voter-btn-story {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
      z-index: 60;
    }

    .voter-btn-story.active {
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.15);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .voter-btn-story.has-voted {
      border-color: #10b981;
    }

    .voter-btn-story span.voter-ico { font-size: 18px; }
    .voter-btn-story span.voter-name { font-size: 10px; font-weight: 700; }
    .voter-btn-story span.voter-check { font-size: 9px; color: #10b981; font-weight: 800; }

    .story-vote-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .story-vote-card {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
      z-index: 60;
    }

    .story-vote-card.selected {
      border-color: #ff2a70;
      background: linear-gradient(135deg, rgba(255, 42, 112, 0.25), rgba(139, 92, 246, 0.25));
      box-shadow: 0 0 14px rgba(255, 42, 112, 0.4);
    }

    .vote-card-title {
      font-size: 13px;
      font-weight: 800;
    }

    .vote-card-sub {
      font-size: 11px;
      color: var(--text-sub);
    }

    .story-radio-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-vote-card.selected .story-radio-dot {
      border-color: #ff2a70;
      background: #ff2a70;
    }

    .story-radio-dot::after {
      content: '✓';
      color: white;
      font-size: 11px;
      font-weight: 900;
      display: none;
    }

    .story-vote-card.selected .story-radio-dot::after {
      display: block;
    }

    .btn-submit-story-vote {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #ff2a70, #8b5cf6);
      color: white;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255, 42, 112, 0.45);
      z-index: 60;
    }

    /* Live Tally Story Box */
    .story-tally-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 12px;
      margin-top: 10px;
    }

    .tally-winner-banner {
      background: linear-gradient(135deg, rgba(255, 184, 0, 0.2), rgba(255, 42, 112, 0.2));
      border: 1px solid rgba(255, 184, 0, 0.4);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #ffd700;
    }

    /* Tap Control Overlay */
    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 32%;
      z-index: 40;
    }
    .tap-zone.left { left: 0; }
    .tap-zone.right { right: 0; width: 68%; }

    /* Footer Prompt */
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-sub);
      z-index: 10;
      margin-top: 10px;
    }

    /* Fullscreen Story Video Modal */
    .video-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .video-modal-backdrop.open {
      display: flex;
    }

    .video-modal-card {
      width: 100%;
      max-width: 440px;
      background: #0f1322;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
    }

    .video-modal-head {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-modal-head h3 {
      font-size: 14px;
      font-weight: 800;
    }

    .btn-close-vmodal {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 800;
    }

    .video-player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
    }

    .video-modal-foot {
      padding: 12px 18px;
      display: flex;
      justify-content: flex-end;
      background: rgba(0, 0, 0, 0.3);
    }

    .btn-direct-yt {
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

    <!-- Tap Navigation Zones -->

  </div>

        videoUrl: "https://www.youtube.com/results?search_query=Riu+Palace+Bavaro+tour"
      },
      {
        id: "ziva",
        name: "Hyatt Ziva Puerto Vallarta",
        rank: 6,
        badge: "Baseline Control (#6)",
        score: "77 / 100",
        price: "$9,275.00",
        savings: "Baseline ($0)",
        location: "Puerto Vallarta, Mexico",
        heroImg: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
        roomImg: "https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=800&q=80",
        pitch: "Repeat the 2025 trip: zero uncertainty and strong parent confidence, but zero novelty.",
        perks: [
          { icon: "🏖️", text: "Private secluded cove beach & calm Pacific waters" },
          { icon: "🌮", text: "Known food carts, taco shacks & dessert stations" },
          { icon: "✨", text: "Zero learning curve & reliable 5-star service" },
          { icon: "⚠️", text: "Zero novelty: repeating a trip already taken" }
        ],
        videoTitle: "Hyatt Ziva Puerto Vallarta Resort Walkthrough",
        youtubeId: "WjK7eS5hJ-Y",
        videoUrl: "https://www.youtube.com/results?search_query=Hyatt+Ziva+Puerto+Vallarta+tour"
      }
    ];

    const FAMILY_MEMBERS = [
      { id: "todd", name: "Todd", role: "Dad", avatar: "👨‍💼" },
      { id: "meiling", name: "Mei-Ling", role: "Mom", avatar: "👩‍💼" },
      { id: "sofia", name: "Sofia", role: "Teen", avatar: "👧" },
      { id: "cora", name: "Cora", role: "Teen", avatar: "👧" },
      { id: "violet", name: "Violet", role: "Teen", avatar: "👧" }
    ];

    // State
    let currentSlide = 0;
    let totalSlides = 0;
    let activeVoter = "sofia"; // default to one of the girls for fun teen vibe!
    let votingVotes = JSON.parse(localStorage.getItem('teen_story_votes') || '{}');

    // Initialize App
    function init() {
      const wrapper = document.getElementById('slidesWrapper');
      let slidesHTML = '';

      // 1. INTRO STORY HOOK SLIDE
      slidesHTML += `
        <div class="slide" style="background: radial-gradient(circle at top right, rgba(255,42,112,0.35), transparent 65%), radial-gradient(circle at bottom left, rgba(139,92,246,0.4), transparent 70%);">
          <div class="slide-content">
            <div>
              <span class="badge" style="background: linear-gradient(135deg, #ff2a70, #8b5cf6);">✈️ Thanksgiving 2026</span>
              <h1 class="title-large">Where Are We<br>Going Next?! 🌴</h1>
              <p class="subtitle">5 Travelers · 4 Nights · Nov 20–24.<br>Swipe or tap right to tour the top 6 resorts, watch walkthrough videos, and vote!</p>
            </div>

            <div class="story-hero-card">
              <div style="font-size: 4.5rem; text-align: center; margin: 4px 0;">🏖️✨🎉</div>
              <div style="background: rgba(255,255,255,0.1); padding: 12px; border-radius: 14px; text-align: center; font-weight: 800; font-size: 15px;">
                Tap right to start resort tour →
              </div>
            </div>

            <div class="slide-footer">
              <span>Family Board Edition</span>
              <span>Tap right to start</span>
            </div>
          </div>
        </div>
      `;

      // 2. RESORT STORY SLIDES (2 slides per resort = 12 slides)
      RESORTS.forEach((r, idx) => {
        // Slide A: The Vibe & Room
        slidesHTML += `
          <div class="slide" style="background: radial-gradient(circle at top right, rgba(0,242,254,0.2), transparent 60%), radial-gradient(circle at bottom left, rgba(255,42,112,0.25), transparent 60%);">
            <div class="slide-content">
              <div>
                <span class="badge badge-rank${r.rank}">${r.badge}</span>
                <h2 class="title-option">${r.name}</h2>
                <p class="subtitle">${r.location}</p>
              </div>

              <div class="story-hero-card">
                <div class="resort-img-box" style="background-image: url('${r.heroImg}');">
                  <span class="img-tag">${r.location}</span>
                </div>
                <div class="price-score-row">
                  <div>
                    <span style="font-size: 11px; color: var(--text-sub); display: block;">Package Total</span>
                    <span class="price-val">${r.price}</span>
                  </div>
                  <span class="savings-pill ${r.savings.includes('-') ? 'save-green' : 'save-neutral'}">${r.savings}</span>
                </div>
                <p style="font-size: 13px; color: #f1f5f9; line-height: 1.35;">${r.pitch}</p>
              </div>

              <button class="story-video-btn" onclick="event.stopPropagation(); openVideoModal('${r.id}')">
                <span style="display: flex; align-items: center; gap: 8px;">
                  <span class="video-pulse-icon">▶</span>
                  <span>Watch Video Tour 🎬</span>
                </span>
                <span style="font-size: 11px; opacity: 0.8;">Tap to play →</span>
              </button>

              <div class="slide-footer">
                <span>Score: <strong>${r.score}</strong></span>
                <span>Tap for teen perks →</span>
              </div>
            </div>
          </div>
        `;

        // Slide B: Teen Perks & Features
        const perksHTML = r.perks.map(p => `
          <li class="story-point-item">
            <span class="point-icon">${p.icon}</span>
            <span>${p.text}</span>
          </li>
        `).join('');

        slidesHTML += `
          <div class="slide" style="background: radial-gradient(circle at top right, rgba(139,92,246,0.3), transparent 60%), radial-gradient(circle at bottom left, rgba(16,185,129,0.2), transparent 60%);">
            <div class="slide-content">
              <div>
                <span class="badge badge-rank${r.rank}">Option ${idx + 1} of 6 • Highlights</span>
                <h2 class="title-option">Why It's Epic 🔥</h2>
              </div>

              <div class="story-hero-card" style="justify-content: flex-start;">
                <ul class="story-points-list">
                  ${perksHTML}
                </ul>
              </div>

              <button class="story-video-btn" onclick="event.stopPropagation(); openVideoModal('${r.id}')">
                <span style="display: flex; align-items: center; gap: 8px;">
                  <span class="video-pulse-icon">▶</span>
                  <span>Watch Full Walkthrough 🎬</span>
                </span>
                <span style="font-size: 11px; opacity: 0.8;">Tour & Review →</span>
              </button>

              <div class="slide-footer">
                <span>${r.name}</span>
                <span>Next option next →</span>
              </div>
            </div>
          </div>
        `;
      });

      // 3. SCORECARD & VIDEO SUMMARY SLIDE
      const scorecardHTML = RESORTS.map((r, i) => `
        <div class="scorecard-item">
          <div class="scorecard-left">
            <span class="scorecard-rank">#${i + 1}</span>
            <div class="scorecard-title">
              <strong>${r.name}</strong>
              <span>${r.price} · ${r.savings}</span>
            </div>
          </div>
          <div class="scorecard-right">
            <span class="scorecard-points">${r.score}</span>
            <button class="btn-table-video" onclick="event.stopPropagation(); openVideoModal('${r.id}')" title="Watch ${r.name} Video">
              ▶
            </button>
          </div>
        </div>
      `).join('');

      slidesHTML += `
        <div class="slide" style="background: radial-gradient(circle at top right, rgba(0,242,254,0.3), transparent 60%), radial-gradient(circle at bottom left, rgba(255,42,112,0.3), transparent 60%);">
          <div class="slide-content">
            <div>
              <span class="badge">📊 All 6 Contenders</span>
              <h2 class="title-option">The Scorecard</h2>
              <p class="subtitle">Rankings based on pools, food, price & fun. Tap ▶ to watch any video tour!</p>
            </div>

            <div class="scorecard-list">
              ${scorecardHTML}
            </div>

            <div class="slide-footer">
              <span>All 6 Options</span>
              <span>Tap to vote now →</span>
            </div>
          </div>
        </div>
      `;

      // 4. INTERACTIVE VOTING SLIDE (Slide 15)
      slidesHTML += `
        <div class="slide" style="background: radial-gradient(circle at top right, rgba(255,42,112,0.4), transparent 60%), radial-gradient(circle at bottom left, rgba(139,92,246,0.4), transparent 60%);">
          <div class="slide-content">
            <div>
              <span class="badge" style="background: linear-gradient(135deg, #ff2a70, #ffb800); color: white;">🗳️ Board Decision</span>
              <h2 class="title-option">Cast Your Vote! 🎉</h2>
              <p class="subtitle">Select your name, pick your favorite resort, and submit!</p>
            </div>

            <!-- Voter Selector -->
            <div class="voter-selector-grid" id="voterSelectorGrid"></div>

            <!-- Vote Cards -->
            <div class="story-vote-cards" id="storyVoteCards"></div>

            <button class="btn-submit-story-vote" onclick="submitStoryVote()">Submit My Vote 🗳️</button>

            <!-- Live Tally -->
            <div class="story-tally-box" id="storyTallyBox"></div>

            <div class="slide-footer">
              <span>Family Board Voting</span>
              <span>1 Vote Each</span>
            </div>
          </div>
        </div>
      `;

      wrapper.innerHTML = slidesHTML;
      totalSlides = document.querySelectorAll('.slide').length;

      // Build top story progress bars
      const progressContainer = document.getElementById('storyProgressBar');
      let progressHTML = '';
      for (let i = 0; i < totalSlides; i++) {
        progressHTML += `
          <div class="story-progress-segment" id="prog-${i}">
            <div class="story-progress-fill"></div>
          </div>
        `;
      }
      progressContainer.innerHTML = progressHTML;

      renderVoterSelector();
      renderVoteCards();
      renderTally();
      updateSlide();
    }

    // Render Voter Tabs
    function renderVoterSelector() {
      const grid = document.getElementById('voterSelectorGrid');
      if (!grid) return;

      grid.innerHTML = FAMILY_MEMBERS.map(m => {
        const isActive = activeVoter === m.id;
        const hasVoted = !!votingVotes[m.id];
        return `
          <div class="voter-btn-story ${isActive ? 'active' : ''} ${hasVoted ? 'has-voted' : ''}" 
               onclick="event.stopPropagation(); selectVoter('${m.id}')">
            <span class="voter-ico">${m.avatar}</span>
            <span class="voter-name">${m.name}</span>
            <span class="voter-check">${hasVoted ? '✓ Voted' : 'Pending'}</span>
          </div>
        `;
      }).join('');
    }

    function selectVoter(voterId) {
      activeVoter = voterId;
      renderVoterSelector();
      renderVoteCards();
    }

    // Render Resort Voting Cards
    function renderVoteCards() {
      const container = document.getElementById('storyVoteCards');
      if (!container) return;

      const currentVote = votingVotes[activeVoter];

      container.innerHTML = RESORTS.map(r => {
        const isSelected = currentVote === r.id;
        return `
          <div class="story-vote-card ${isSelected ? 'selected' : ''}" 
               onclick="event.stopPropagation(); castVote('${r.id}')">
            <div>
              <div class="vote-card-title">${r.name}</div>
              <div class="vote-card-sub">${r.price} · Score ${r.score}</div>
            </div>
            <div class="story-radio-dot"></div>
          </div>
        `;
      }).join('');
    }

    function castVote(resortId) {
      votingVotes[activeVoter] = resortId;
      localStorage.setItem('teen_story_votes', JSON.stringify(votingVotes));
      renderVoterSelector();
      renderVoteCards();
      renderTally();
    }

    function submitStoryVote() {
      if (!votingVotes[activeVoter]) {
        alert("Please tap your favorite resort above first!");
        return;
      }
      const member = FAMILY_MEMBERS.find(m => m.id === activeVoter);
      const chosenResort = RESORTS.find(r => r.id === votingVotes[activeVoter]);
      alert(`🎉 Vote Recorded!\n${member.name} voted for: ${chosenResort.name}`);
    }

    // Render Live Board Tally
    function renderTally() {
      const container = document.getElementById('storyTallyBox');
      if (!container) return;

      const counts = {};
      RESORTS.forEach(r => counts[r.id] = 0);
      let total = 0;

      Object.values(votingVotes).forEach(resortId => {
        if (counts[resortId] !== undefined) {
          counts[resortId]++;
          total++;
        }
      });

      const sorted = [...RESORTS].sort((a, b) => counts[b.id] - counts[a.id]);
      const leader = counts[sorted[0].id] > 0 ? sorted[0] : null;

      let winnerHTML = '';
      if (leader) {
        winnerHTML = `
          <div class="tally-winner-banner">
            <span>🏆 Current Leader:</span>
            <strong>${leader.name} (${counts[leader.id]} vote${counts[leader.id] > 1 ? 's' : ''})</strong>
          </div>
        `;
      }

      let rowsHTML = sorted.map(r => {
        const c = counts[r.id] || 0;
        const pct = total > 0 ? Math.round((c / 5) * 100) : 0;
        return `
          <div style="display: flex; justify-content: space-between; font-size: 11px; margin-top: 3px;">
            <span>${r.name}</span>
            <strong>${c} vote${c===1?'':'s'}</strong>
          </div>
          <div style="height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; margin-bottom: 4px;">
            <div style="width: ${pct}%; height: 100%; background: #ff2a70; border-radius: 3px;"></div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        ${winnerHTML}
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 4px;">
          <span>Turnout: <strong>${total} / 5 Voted</strong></span>
          <span style="color: #38bdf8; cursor: pointer;" onclick="event.stopPropagation(); resetStoryVotes()">Reset</span>
        </div>
        ${rowsHTML}
      `;
    }

    function resetStoryVotes() {
      if (confirm("Reset all board votes?")) {
        votingVotes = {};
        localStorage.removeItem('teen_story_votes');
        renderVoterSelector();
        renderVoteCards();
        renderTally();
      }
    }

    // Slide Navigation
    function updateSlide() {
      const wrapper = document.getElementById('slidesWrapper');
      wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;

      const counter = document.getElementById('storySlideCounter');
      if (counter) counter.innerText = `${currentSlide + 1} of ${totalSlides}`;

      for (let i = 0; i < totalSlides; i++) {
        const seg = document.getElementById(`prog-${i}`);
        if (!seg) continue;
        if (i < currentSlide) {
          seg.className = 'story-progress-segment completed';
        } else if (i === currentSlide) {
          seg.className = 'story-progress-segment active';
        } else {
          seg.className = 'story-progress-segment';
        }
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function jumpToVote() {
      currentSlide = totalSlides - 1;
      updateSlide();
    }

    // Video Modal
    function openVideoModal(resortId) {
      const resort = RESORTS.find(r => r.id === resortId);
      if (!resort) return;

      const modal = document.getElementById('videoModal');
      const title = document.getElementById('videoModalTitle');
      const sub = document.getElementById('videoModalSub');
      const box = document.getElementById('videoIframeBox');
      const direct = document.getElementById('videoDirectLink');

      title.innerText = resort.videoTitle;
      sub.innerText = `${resort.name} · Walkthrough Tour`;
      direct.href = resort.videoUrl;

      box.innerHTML = `
        <iframe width="100%" height="100%" 
                src="https://www.youtube-nocookie.com/embed/${resort.youtubeId}?autoplay=1&rel=0" 
                title="${resort.videoTitle}" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
      `;

      modal.classList.add('open');
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const box = document.getElementById('videoIframeBox');
      box.innerHTML = '';
      modal.classList.remove('open');
    }

    // Touch Swipe Support
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 40) nextSlide();
      if (touchEndX > touchStartX + 40) prevSlide();
    }, { passive: true });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    init();
  </script>
