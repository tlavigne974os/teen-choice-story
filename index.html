<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thanksgiving 2026 — Family Choice & Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 22, 36, 0.88);
      --accent-pink: #ff2a70;
      --accent-purple: #8b5cf6;
      --accent-cyan: #00f2fe;
      --accent-gold: #ffb800;
      --accent-green: #10b981;
      --text: #ffffff;
      --text-sub: #94a3b8;
      --card-radius: 20px;
      --font-display: 'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030407;
      color: var(--text);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
    }

    /* Mobile Container Frame */
    .story-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 440px;
      max-height: 920px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
    }

    @media (min-width: 450px) and (min-height: 680px) {
      .story-container {
        border-radius: 40px;
        height: 92vh;
        border: 2px solid rgba(255, 255, 255, 0.15);
      }
    }

    /* Story Top Progress Bars */
    .story-progress-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 3px;
      z-index: 100;
    }

    .story-seg {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      overflow: hidden;
    }

    .story-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 2px;
      transition: width 0.15s linear;
    }

    .story-seg.active .story-fill,
    .story-seg.completed .story-fill {
      width: 100%;
    }

    /* Top Floating Story Header */
    .story-header {
      position: absolute;
      top: 22px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 90;
    }

    .story-author {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .author-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 10px rgba(255, 42, 112, 0.5);
    }

    .author-text strong {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      display: block;
      line-height: 1.1;
    }

    .author-text span {
      font-size: 10px;
      color: var(--text-sub);
    }

    .btn-quick-vote {
      background: linear-gradient(135deg, #ff2a70, #8b5cf6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 42, 112, 0.4);
      z-index: 95;
    }

    /* Slides Viewport */
    .slides-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide {
      min-width: 100%;
      height: 100%;
      padding: 64px 16px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background-size: cover;
      background-position: center;
      overflow-y: auto;
    }

    .slide-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    /* Badges & Titles */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .badge-rank1 { background: linear-gradient(135deg, #ff2a70, #ff6b4a); border: none; }
    .badge-rank2 { background: linear-gradient(135deg, #0d9488, #00f2fe); border: none; }
    .badge-rank3 { background: linear-gradient(135deg, #10b981, #059669); border: none; }
    .badge-rank4 { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; }
    .badge-rank5 { background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; }

    .title-large {
      font-family: var(--font-display);
      font-size: 1.95rem;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.5px;
      margin-top: 6px;
      background: linear-gradient(135deg, #ffffff 40%, #ffd1e0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-resort {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 900;
      line-height: 1.15;
      margin-top: 4px;
      color: #fff;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.35;
      margin-top: 3px;
    }

    /* Lead-in Cards */
    .lead-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--card-radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 6px 0;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    .lead-benchmark-box {
      background: rgba(0, 0, 0, 0.4);
      border-left: 4px solid var(--accent-gold);
      border-radius: 0 14px 14px 0;
      padding: 10px 12px;
    }

    .lead-benchmark-box span {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
      display: block;
    }

    .lead-benchmark-box strong {
      font-size: 17px;
      color: #fff;
      display: block;
      margin-top: 2px;
    }

    /* Lineup Grid */
    .lineup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 6px 0;
    }

    .lineup-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .lineup-item:active {
      transform: scale(0.97);
    }

    .lineup-item strong {
      font-size: 11.5px;
      color: #fff;
      line-height: 1.2;
    }

    .lineup-price {
      font-size: 11px;
      font-weight: 800;
      color: #38bdf8;
    }

    .lineup-tag {
      font-size: 9.5px;
      color: var(--text-sub);
    }

    /* Tagline Floating Banner */
    .resort-tagline-pill {
      background: linear-gradient(135deg, rgba(255, 42, 112, 0.22), rgba(139, 92, 246, 0.22));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-left: 3.5px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 7px 10px;
      margin: 5px 0 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.35;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    /* Main Visual Card */
    .story-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--card-radius);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 4px 0;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    .resort-img-preview {
      width: 100%;
      height: 145px;
      border-radius: 14px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .img-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 10px;
    }

    /* Action Buttons Row */
    .action-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      position: relative;
      z-index: 50;
    }

    .story-video-btn {
      flex: 1;
      padding: 11px 12px;
      background: linear-gradient(135deg, #ff2a70, #8b5cf6);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 16px;
      color: white;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(255, 42, 112, 0.45);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .story-video-btn:active {
      transform: scale(0.97);
    }

    .pulse-play {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: white;
      color: #ff2a70;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      box-shadow: 0 0 10px white;
      animation: pulseAnim 2s infinite ease-in-out;
    }

    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .story-instant-vote-btn {
      background: rgba(16, 185, 129, 0.25);
      border: 1.5px solid #10b981;
      color: #34d399;
      padding: 10px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: transform 0.15s ease;
    }

    .story-instant-vote-btn:active {
      transform: scale(0.96);
      background: #10b981;
      color: white;
    }

    /* Price Row */
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 12px;
      padding: 7px 11px;
    }

    .price-num {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 900;
      color: #fff;
    }

    .savings-badge {
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 7px;
    }

    .save-green { background: rgba(16, 185, 129, 0.25); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .save-neutral { background: rgba(255, 255, 255, 0.15); color: #cbd5e1; }

    /* Perks */
    .perks-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .perk-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: #f8fafc;
    }

    .perk-ico {
      font-size: 18px;
      flex-shrink: 0;
    }

    /* Scorecard Slide */
    .scorecard-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 6px 0;
      max-height: 460px;
      overflow-y: auto;
    }

    .scorecard-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 8px 11px;
      gap: 8px;
    }

    .scorecard-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .score-rank-badge {
      font-size: 12px;
      font-weight: 900;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .scorecard-info strong {
      display: block;
      font-size: 12px;
    }

    .scorecard-info span {
      font-size: 10.5px;
      color: var(--text-sub);
    }

    .scorecard-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-video-icon {
      background: linear-gradient(135deg, #ff2a70, #ff5e3a);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 42, 112, 0.6);
    }

    /* Voting Page */
    .voting-slide-box {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      z-index: 50;
    }

    .voter-selector-bar {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 5px 0 8px;
    }

    .voter-selector-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-sub);
    }

    .voter-tabs-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .voter-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 13px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .voter-pill.active {
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.2);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
    }

    .voter-pill.voted {
      border-color: #10b981;
    }

    .voter-pill .v-ico { font-size: 17px; }
    .voter-pill .v-name { font-size: 10px; font-weight: 800; color: #fff; }
    .voter-pill .v-check { font-size: 9px; color: #10b981; font-weight: 800; }

    .simple-ballot-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 8px;
      padding-right: 4px;
    }

    .ballot-item-row {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 8px 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .ballot-item-row.is-picked {
      border-color: #10b981;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(0, 242, 254, 0.2));
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
    }

    .ballot-title strong {
      display: block;
      font-size: 12px;
      color: #fff;
    }

    .ballot-title span {
      font-size: 10px;
      color: var(--text-sub);
    }

    .btn-vote-yes {
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .ballot-item-row.is-picked .btn-vote-yes {
      background: #10b981;
      border-color: #10b981;
      color: white;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    .live-tally-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 9px 11px;
    }

    .tally-winner-banner {
      background: linear-gradient(135deg, rgba(255, 184, 0, 0.25), rgba(255, 42, 112, 0.25));
      border: 1px solid rgba(255, 184, 0, 0.5);
      border-radius: 10px;
      padding: 6px 9px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      font-size: 11px;
      font-weight: 800;
      color: #ffd700;
    }

    .tally-member-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .v-chip {
      background: rgba(255, 255, 255, 0.12);
      font-size: 9.5px;
      padding: 2px 5px;
      border-radius: 6px;
      color: #e2e8f0;
    }

    /* Clear Bottom Navigation Controls */
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-sub);
      z-index: 50;
      margin-top: 6px;
      padding-top: 4px;
    }

    .nav-buttons-row {
      display: flex;
      gap: 6px;
    }

    .btn-nav-step {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 14px;
      cursor: pointer;
    }

    .btn-nav-step:hover, .btn-nav-step:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Modern TikTok / Short Video Modal */
    .video-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(14px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .video-modal-backdrop.open {
      display: flex;
    }

    .video-modal-card {
      width: 100%;
      max-width: 380px;
      background: #0f1322;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 26px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
    }

    .video-modal-head {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .video-type-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff2a70, #ff007a);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 8px;
      margin-bottom: 2px;
    }

    .video-modal-head h3 {
      font-size: 13.5px;
      font-weight: 800;
      color: #fff;
    }

    .btn-close-vmodal {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 9:16 Vertical Video Box for Shorts */
    .video-player-box {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 60vh;
      background: black;
      position: relative;
    }

    .video-modal-foot {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.5);
    }

    .video-modal-foot-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-direct-yt-app {
      background: #ff0000;
      color: white;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(255, 0, 0, 0.4);
    }

    .btn-switch-tour-mode {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="story-container" id="storyContainer" onclick="handleContainerTap(event)">

            <div class="voter-selector-bar">
              <span class="voter-selector-label">1. Select Who Is Voting:</span>
              <div class="voter-tabs-row" id="voterTabsRow"></div>
            </div>

            <!-- Simple Vote List -->
            <div class="simple-ballot-list" id="simpleBallotList"></div>

            <!-- Live Scoreboard -->
            <div class="live-tally-card" id="liveTallyCard"></div>

            <div class="slide-footer">
              <span>Family Board Voting</span>
              <div class="nav-buttons-row">
                <button class="btn-nav-step" onclick="event.stopPropagation(); prevSlide()">← Scorecard</button>
                <button class="btn-nav-step" onclick="event.stopPropagation(); goToSlide(0)">Start Over ↺</button>
              </div>
            </div>
          </div>
        </div>
      `;

      wrapper.innerHTML = slidesHTML;
      totalSlides = document.querySelectorAll('.slide').length;

      // Progress bars
      const progressContainer = document.getElementById('storyProgressBar');
      let progressHTML = '';
      for (let i = 0; i < totalSlides; i++) {
        progressHTML += `
          <div class="story-seg" id="seg-${i}">
            <div class="story-fill"></div>
          </div>
        `;
      }
      progressContainer.innerHTML = progressHTML;

      renderVoterPills();
      renderBallotList();
      renderTally();
      updateSlide();
    }

    // =========================================================================
    // VOTING LOGIC
    // =========================================================================
    function renderVoterPills() {
      const row = document.getElementById('voterTabsRow');
      if (!row) return;

      row.innerHTML = FAMILY_MEMBERS.map(m => {
        const isActive = activeVoter === m.id;
        const hasVoted = !!votingVotes[m.id];
        return `
          <div class="voter-pill ${isActive ? 'active' : ''} ${hasVoted ? 'voted' : ''}" 
               onclick="event.stopPropagation(); selectVoter('${m.id}')">
            <span class="v-ico">${m.avatar}</span>
            <span class="v-name">${m.name}</span>
            <span class="v-check">${hasVoted ? '✓ Voted' : 'Pick'}</span>
          </div>
        `;
      }).join('');
    }

    function selectVoter(voterId) {
      activeVoter = voterId;
      renderVoterPills();
      renderBallotList();
    }

    function renderBallotList() {
      const container = document.getElementById('simpleBallotList');
      if (!container) return;

      const currentVote = votingVotes[activeVoter];

      container.innerHTML = RESORTS.map(r => {
        const isPicked = currentVote === r.id;
        return `
          <div class="ballot-item-row ${isPicked ? 'is-picked' : ''}" onclick="event.stopPropagation(); toggleVote('${r.id}')">
            <div class="ballot-title">
              <strong>${r.name}</strong>
              <span>${r.price} · ${r.savings}</span>
            </div>
            <button class="btn-vote-yes">
              ${isPicked ? '✓ VOTED YES' : '👍 Vote YES'}
            </button>
          </div>
        `;
      }).join('');
    }

    function toggleVote(resortId) {
      if (votingVotes[activeVoter] === resortId) {
        delete votingVotes[activeVoter];
      } else {
        votingVotes[activeVoter] = resortId;
      }
      localStorage.setItem('teen_story_votes', JSON.stringify(votingVotes));
      renderVoterPills();
      renderBallotList();
      renderTally();
    }

    function quickVoteForResort(resortId) {
      votingVotes[activeVoter] = resortId;
      localStorage.setItem('teen_story_votes', JSON.stringify(votingVotes));
      const member = FAMILY_MEMBERS.find(m => m.id === activeVoter);
      const chosenResort = RESORTS.find(r => r.id === resortId);
      alert(`🎉 ${member.name} voted for ${chosenResort.name}!\nTaking you to the live board tally...`);
      jumpToVote();
    }

    function renderTally() {
      const container = document.getElementById('liveTallyCard');
      if (!container) return;

      const tally = {};
      RESORTS.forEach(r => {
        tally[r.id] = { resort: r, votes: 0, voters: [] };
      });

      let totalVoted = 0;
      FAMILY_MEMBERS.forEach(m => {
        const pick = votingVotes[m.id];
        if (pick && tally[pick]) {
          tally[pick].votes++;
          tally[pick].voters.push(m);
          totalVoted++;
        }
      });

      const sorted = Object.values(tally).sort((a, b) => b.votes - a.votes);
      const leader = sorted[0]?.votes > 0 ? sorted[0] : null;

      let bannerHTML = '';
      if (leader) {
        bannerHTML = `
          <div class="tally-winner-banner">
            <span>🏆 Current Leader:</span>
            <strong>${leader.resort.name} (${leader.votes} vote${leader.votes > 1 ? 's' : ''})</strong>
          </div>
        `;
      }

      let breakdownHTML = sorted.map(item => {
        const pct = totalVoted > 0 ? Math.round((item.votes / 5) * 100) : 0;
        return `
          <div style="margin-top: 4px;">
            <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 2px;">
              <strong style="color: #fff;">${item.resort.name}</strong>
              <span style="color: #38bdf8; font-weight: 800;">${item.votes} vote${item.votes === 1 ? '' : 's'}</span>
            </div>
            <div style="height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden;">
              <div style="width: ${pct}%; height: 100%; background: linear-gradient(90deg, #ff2a70, #8b5cf6); border-radius: 3px;"></div>
            </div>
            ${item.voters.length > 0 ? `
              <div class="tally-member-chips">
                ${item.voters.map(v => `<span class="v-chip">${v.avatar} ${v.name}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      container.innerHTML = `
        ${bannerHTML}
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 6px;">
          <span>Turnout: <strong>${totalVoted} of 5 Voted</strong></span>
          <span style="color: #ff2a70; font-weight: 700; cursor: pointer;" onclick="event.stopPropagation(); resetStoryVotes()">Reset All</span>
        </div>
        ${breakdownHTML}
      `;
    }

    function resetStoryVotes() {
      if (confirm("Reset all 5 board votes?")) {
        votingVotes = {};
        localStorage.removeItem('teen_story_votes');
        renderVoterPills();
        renderBallotList();
        renderTally();
      }
    }

    // =========================================================================
    // CONTAINER TAP & NAVIGATION
    // =========================================================================
    function handleContainerTap(e) {
      // Ignore clicks on buttons, links, cards, pills, modals, inputs
      if (e.target.closest('button, a, iframe, .video-modal-card, .voter-pill, .ballot-item-row, .lineup-item, .scorecard-card')) {
        return;
      }
      // On voting slide, do not tap-navigate
      if (currentSlide === totalSlides - 1) return;

      const rect = document.getElementById('storyContainer').getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < rect.width * 0.32) {
        prevSlide();
      } else {
        nextSlide();
      }
    }

    function updateSlide() {
      const wrapper = document.getElementById('slidesWrapper');
      wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;

      const counter = document.getElementById('storySlideCounter');
      if (counter) counter.innerText = `${currentSlide + 1} of ${totalSlides}`;

      for (let i = 0; i < totalSlides; i++) {
        const seg = document.getElementById(`seg-${i}`);
        if (!seg) continue;
        if (i < currentSlide) {
          seg.className = 'story-seg completed';
        } else if (i === currentSlide) {
          seg.className = 'story-seg active';
        } else {
          seg.className = 'story-seg';
        }
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function goToSlide(idx) {
      if (idx >= 0 && idx < totalSlides) {
        currentSlide = idx;
        updateSlide();
      }
    }

    function jumpToVote() {
      currentSlide = totalSlides - 1;
      updateSlide();
    }

    // =========================================================================
    // SHORT-FORM / TIKTOK VIDEO MODAL + WALKTHROUGH TOGGLE
    // =========================================================================
    function openVideoModal(resortId, mode = "short") {
      currentModalResortId = resortId;
      currentModalMode = mode;

      const resort = RESORTS.find(r => r.id === resortId);
      if (!resort) return;

      const modal = document.getElementById('videoModal');
      const badge = document.getElementById('videoModalBadge');
      const title = document.getElementById('videoModalTitle');
      const box = document.getElementById('videoIframeBox');
      const direct = document.getElementById('videoDirectLink');
      const toggleBtn = document.getElementById('btnToggleTourMode');

      const isShort = (currentModalMode === "short");
      const activeVidId = isShort ? resort.shortId : resort.fullId;
      const activeTitle = isShort ? resort.shortTitle : resort.fullTitle;
      const activeUrl = isShort ? resort.shortUrl : resort.fullUrl;

      badge.innerText = isShort ? "⚡ 60s TikTok Short" : "🎬 Full Walkthrough Tour";
      badge.style.background = isShort ? "linear-gradient(135deg, #ff2a70, #ff007a)" : "linear-gradient(135deg, #0284c7, #2563eb)";
      title.innerText = activeTitle;
      direct.href = activeUrl;
      toggleBtn.innerText = isShort ? "🔄 Switch to Full Tour (20m)" : "⚡ Switch to 60s Short";

      // Adjust aspect ratio for shorts vs full
      box.style.aspectRatio = isShort ? "9 / 16" : "16 / 9";

      box.innerHTML = `
        <iframe width="100%" height="100%" 
                src="https://www.youtube.com/embed/${activeVidId}?autoplay=1&playsinline=1&rel=0&modestbranding=1" 
                title="${activeTitle}" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
        </iframe>
      `;

      modal.classList.add('open');
    }

    function toggleTourMode() {
      if (!currentModalResortId) return;
      currentModalMode = (currentModalMode === "short") ? "full" : "short";
      openVideoModal(currentModalResortId, currentModalMode);
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const box = document.getElementById('videoIframeBox');
      box.innerHTML = '';
      modal.classList.remove('open');
    }

    // Swipe Gesture Navigation
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      if (currentSlide !== totalSlides - 1) {
        if (touchEndX < touchStartX - 60) nextSlide();
        if (touchEndX > touchStartX + 60) prevSlide();
      }
    }, { passive: true });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeVideoModal();
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    init();
  </script>
</body>
</html>
